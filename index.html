<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lackey · Secure access</title><style>body{font:17px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7fb;color:#172b4d;margin:0;padding:40px}main{max-width:600px;margin:8vh auto;background:white;padding:32px;border-radius:16px}a,button{font:inherit;display:inline-block;padding:12px 18px;border-radius:8px;background:#1756bf;color:white;border:0;cursor:pointer;text-decoration:none}p{line-height:1.5}</style><main><h1>Lackey</h1><p>Takeoff and Repairs now share one secure sign-in.</p><p id="pending" hidden>This browser has pending Takeoff changes. Download a backup before opening Lackey. Your local records will remain on this device.</p><button id="backup" hidden>Download pending backup</button><p><a href="https://lackey-repairs.hugoaleal.workers.dev/">Open Lackey</a></p></main><script>
