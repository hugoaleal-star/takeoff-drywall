<style>
/* Layout: field tablet tool — sticky header + tabs, stacked room cards, sticky totals bar at the bottom. Surface colors follow the board: grey = regular, blue = ceiling, green = MR (green board). */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f5f7f9; --ink:#16202a; --muted:#5a6775; --line:#d2d8df;
  --accent:#1f56c3; --accent-ink:#ffffff; --wall:#5f6b79; --clg:#2a66d0; --mr:#2b8a4b; --danger:#b42318;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --surface2:#151b22; --ink:#e5eaf0; --muted:#94a1ae; --line:#2b3540;
  --accent:#6f9cff; --accent-ink:#0d1420; --wall:#a3aebb; --clg:#77a3ff; --mr:#5fc782; --danger:#ff7b6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --surface2:#151b22; --ink:#e5eaf0; --muted:#94a1ae; --line:#2b3540;
  --accent:#6f9cff; --accent-ink:#0d1420; --wall:#a3aebb; --clg:#77a3ff; --mr:#5fc782; --danger:#ff7b6e; color-scheme:dark}
*{box-sizing:border-box}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;width:100%;min-width:0}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}

.brand .mark{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--wall) 0 33%,var(--clg) 33% 66%,var(--mr) 66%);flex:none}

.status.busy i{background:var(--clg)} .status.local i{background:#c98a12}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:46px;font-weight:600}

.surfaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.toggle{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}

.room-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.room-foot b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.room-foot .tot{margin-left:auto;font-size:15px}
.room-foot .tot b{font-size:18px;color:var(--accent)}
.add-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctr-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:46px;font-family:var(--f-display);font-weight:600;font-size:17px}
.pill .num{font-size:13px;color:var(--muted);margin-left:2px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.on .num{color:inherit;opacity:.8}
.pill.add{border-style:dashed;background:transparent;color:var(--accent)}
.ctr-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:14px}
.ctr-acts{display:flex;gap:8px;flex-wrap:wrap}
.ctr-tot{grid-column:1/-1;font-size:14px;color:var(--muted)}
.ctr-tot b{color:var(--accent);font-size:18px}
@media (max-width:640px){.ctr-edit{grid-template-columns:minmax(0,1fr)}}
.room-save{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.room.done{padding:0;border-color:var(--line);background:var(--surface2)}
.room-sum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;min-height:56px;border-radius:14px}
.room-sum .ok{width:28px;height:28px;border-radius:50%;background:var(--mr);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.room-sum .rn{font-weight:600;font-size:17px}
.room-sum .q{color:var(--muted)}
.room-sum .calc{color:var(--muted);font-size:13px;font-family:var(--f-num)}
.room-sum .tot{margin-left:auto;font-size:14px;color:var(--muted)}
.room-sum .tot b{font-family:var(--f-num);font-size:18px;color:var(--accent)}
.room-sum .ed{font-weight:600;color:var(--accent);font-size:14px}

.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.grand td{font-weight:700;background:var(--surface2)}
td input{min-height:38px;padding:6px 8px;width:90px;text-align:right}

.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pcard h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.pcard .meta{color:var(--muted);font-size:14px}
.pcard .big{font-family:var(--f-num);font-size:24px;font-weight:600;color:var(--accent)}
.pcard .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;line-height:1.1}
.kpi b{font-family:var(--f-num);font-size:22px;font-weight:600}
.kpi.main b{font-size:30px;color:var(--accent)}
.kpi .lbl{font-size:11px}
.kpi.w .lbl{color:var(--wall)} .kpi.c .lbl{color:var(--clg)} .kpi.m .lbl{color:var(--mr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}

@media (max-width:640px){
  .room-head{grid-template-columns:minmax(0,1fr) 80px}
  .room-head .seg,.room-head .racts{grid-column:span 1}
  .surfaces,.dims{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bar .wrap{gap:12px}
  .kpi.main b{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){.room{transition:border-color .15s}}
.room:focus-within{border-color:var(--accent)}
</style>

<script>
(function(){
const LS_KEY='takeoff_drywall_v1';
const DEF_ASSUME={wall:54,clg:48,mr:48,waste:0.05,h:9};
const DEF_MATS=[
 {name:"Channel (hat / RC) — 12' pcs",basis:'clg',rate:0.75,rateUnit:'LF per ft² (16" o.c.)',qtyUnit:'LF',pack:12,packUnit:'LF / piece'},
 {name:'Screws fine thread — ceilings (to metal channel)',basis:'clg',rate:1.25,rateUnit:'screws per ft²',qtyUnit:'screws',pack:8000,packUnit:'screws / 25 lb bucket'},
 {name:'Screws coarse thread — walls (to wood studs)',basis:'wallsmr',rate:1,rateUnit:'screws per ft²',qtyUnit:'screws',pack:8000,packUnit:'screws / 25 lb bucket'},
 {name:'Joint compound (mezcla)',basis:'all',rate:0.138,rateUnit:'lb per ft²',qtyUnit:'lb',pack:62,packUnit:'lb / 4.5 gal box'},
 {name:'Fire tape',basis:'all',rate:0.37,rateUnit:'LF per ft²',qtyUnit:'LF',pack:500,packUnit:'LF / roll'}
];
const CHIPS={
  units:['Bedroom','Bathroom','Kitchen','Living / Dining','Closet','Hallway','Laundry','Entry'],
  common:['Corridor','Stair','Lobby','Elevator Lobby','Trash Room','Mech / Elec','Mail Room','Package Room','Restroom','Janitor Closet','Storage'],
  amenities:['Clubhouse','Leasing Office','Fitness / Gym','Yoga Studio','Business Center','Conference Room','Game Room','Theater','Club Kitchen','Pool Restroom','Locker Room / Showers','Pet Spa','Bike Room','Coffee Bar']
};
const MR_HINT=/bath|restroom|laundry|trash|shower|locker|pool|pet spa|janitor/i;
const CTR={units:'unitTypes',common:'groups'};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*10)/10).toLocaleString('en-US');
const fmt0=n=>Math.round(n).toLocaleString('en-US');
function ru(x){if(!(x>0))return 0;return Math.ceil(Math.round(x*1e9)/1e9);}
// tiny safe arithmetic evaluator: + - * / x ( )
function evalExpr(s){
  s=String(s??'').trim().replace(/,/g,'.').replace(/[x×]/gi,'*');
  if(!s)return 0;
  let i=0;const peek=()=>s[i];const ws=()=>{while(s[i]===' ')i++;};
  function num(){ws();let st=i;while(/[0-9.]/.test(s[i]||''))i++;if(st===i)throw 0;return parseFloat(s.slice(st,i));}
  function fac(){ws();if(peek()==='('){i++;const v=expr();ws();if(peek()!==')')throw 0;i++;return v;}if(peek()==='-'){i++;return -fac();}return num();}
  function term(){let v=fac();for(;;){ws();const c=peek();if(c==='*'){i++;v*=fac();}else if(c==='/'){i++;const d=fac();v=d?v/d:0;}else return v;}}
  function expr(){let v=term();for(;;){ws();const c=peek();if(c==='+'){i++;v+=term();}else if(c==='-'){i++;v-=term();}else return v;}}
  try{const v=expr();ws();if(i<s.length)return NaN;return v;}catch(e){return NaN;}
}
const val=s=>{const v=evalExpr(s);return isFinite(v)?v:0;};
const isExpr=s=>/[+\-*/x×()]/i.test(String(s||'').replace(/^\s*-/,''));

/* Lengths, including what laser meters type in keyboard mode:
   12'6"  12' 6 1/2"  12'-6 1/2"  12 6  12-6  12.5  12.5ft  150"  6 1/2"  3.812m  381cm  3812mm
   iPad smart quotes (’ ” ′ ″) are accepted. Result is in feet. */
function parseLen(raw){
  let s=String(raw??'').trim().toLowerCase()
    .replace(/[’‘′`´]/g,"'").replace(/[”“″]/g,'"').replace(/''/g,'"')
    .replace(/(\d),(\d)/g,'$1.$2').replace(/\s+/g,' ');
  if(!s)return 0;
  const N='(\\d+(?:\\.\\d+)?)',F='(\\d+)\\s*/\\s*(\\d+)';
  let m;
  const fr=(a,b)=>a&&b&&+b?(+a)/(+b):0;
  if((m=s.match(new RegExp('^'+N+'\\s*(mm|cm|m)$'))))return +m[1]*({mm:1/304.8,cm:1/30.48,m:3.280839895})[m[2]];
  if((m=s.match(new RegExp('^'+N+'\\s*(?:ft|feet)$'))))return +m[1];
  // inches only: 150"  6 1/2"  1/2"
  if((m=s.match(new RegExp('^(?:'+N+')?(?:[ -]*'+F+')?\\s*(?:"|in|inch|inches)$')))&&(m[1]||m[2]))return((+m[1]||0)+fr(m[2],m[3]))/12;
  // feet + inches: 12'6"  12' 6 1/2"  12'-6-1/2  12' 1/2"
  if((m=s.match(new RegExp('^'+N+"\\s*(?:'|ft)\\s*-?\\s*(?:"+N+')?(?:[ -]*'+F+')?\\s*(?:"|in)?$'))))
    return +m[1]+((+m[2]||0)+fr(m[3],m[4]))/12;
  // 12 6   12-6   12 6 1/2
  if((m=s.match(new RegExp('^(\\d+)[ -]+'+N+'(?:[ -]+'+F+')?$'))))return +m[1]+(+m[2]+fr(m[3],m[4]))/12;
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function lenTxt(n){
  if(!n)return '';
  let ft=Math.floor(n+1e-9),eighths=Math.round((n-ft)*96);
  if(eighths>=96){ft++;eighths=0;}
  const inch=Math.floor(eighths/8);let r=eighths%8,d=8;
  while(r&&r%2===0){r/=2;d/=2;}
  const frac=r?` ${r}/${d}`:'';
  if(!inch&&!r)return `${ft}'`;
  return `${ft}' ${inch}${frac}"`;
}

/* ---------- model ---------- */
function newRoom(name=''){return{id:uid(),name,qty:'1',mode:'sf',walls:'',clg:'',mr:'',L:'',W:'',H:'',mrWalls:MR_HINT.test(name)};}
const newUnitType=(name='Unit A',count='1')=>({id:uid(),name,count,rooms:[]});
const newGroup=(name='Level 1')=>({id:uid(),name,rooms:[]});
function newProject(){
  return{name:'New project',address:'',levels:'',drawings:'',date:new Date().toISOString().slice(0,10),
    assume:{...DEF_ASSUME},unitTypes:[newUnitType()],groups:[newGroup()],mats:DEF_MATS.map(m=>({...m})),updatedAt:Date.now()};
}
// Older projects had one typical unit + one common list; carry them into the new shape.
function normalize(p){
  let migrated=false;
  p.assume={...DEF_ASSUME,...(p.assume||{})};
  if(!Array.isArray(p.unitTypes)){
    p.unitTypes=[{id:'ut1',name:'Unit A',count:String(p.units??'1'),rooms:Array.isArray(p.typical)?p.typical:[]}];migrated=true;
  }
  if(!Array.isArray(p.groups)){
    p.groups=[{id:'grp1',name:'Common Areas',rooms:Array.isArray(p.common)?p.common:[]}];migrated=true;
  }
  if(migrated){delete p.typical;delete p.common;delete p.units;}
  p.unitTypes.forEach(u=>{u.rooms=Array.isArray(u.rooms)?u.rooms:[];});
  p.groups.forEach(g=>{g.rooms=Array.isArray(g.rooms)?g.rooms:[];});
  if(!Array.isArray(p.mats)||!p.mats.length)p.mats=DEF_MATS.map(m=>({...m}));
  return migrated;
}
function roomSF(r,A,hd){
  const q=val(r.qty);
  if(r.mode==='dim'){
    const L=parseLen(r.L),W=parseLen(r.W),H=parseLen(r.H)||parseLen(hd)||+A.h||0;
    const wallSF=2*(L+W)*H,clg=L*W;
    return{q,w:r.mrWalls?0:wallSF,c:clg,m:r.mrWalls?wallSF:0,L,W,H};
  }
  return{q,w:val(r.walls),c:val(r.clg),m:val(r.mr)};
}
function roomCalc(r,A,hd){
  const s=roomSF(r,A,hd),k=1+(+A.waste||0);
  const ws=ru(s.w/(+A.wall||1)*k),cs=ru(s.c/(+A.clg||1)*k),ms=ru(s.m/(+A.mr||1)*k);
  const per=ws+cs+ms;return{...s,ws,cs,ms,per,tot:s.q*per};
}
function secCalc(list,A,hd){
  const t={q:0,w:0,c:0,m:0,ws:0,cs:0,ms:0,per:0,tot:0};
  list.forEach(r=>{const c=roomCalc(r,A,hd);t.q+=c.q;t.w+=c.q*c.w;t.c+=c.q*c.c;t.m+=c.q*c.m;t.ws+=c.q*c.ws;t.cs+=c.q*c.cs;t.ms+=c.q*c.ms;t.per+=c.q*c.per;t.tot+=c.tot;});
  return t;
}
function projCalc(p){
  const A=p.assume;
  const units=p.unitTypes.map(u=>{const n=val(u.count),s=secCalc(u.rooms,A,u.h);return{u,n,s,w:n*s.w,c:n*s.c,m:n*s.m,tot:n*s.tot,ws:n*s.ws,cs:n*s.cs,ms:n*s.ms};});
  const groups=p.groups.map(g=>{const s=secCalc(g.rooms,A,g.h);return{g,s,w:s.w,c:s.c,m:s.m,tot:s.tot,ws:s.ws,cs:s.cs,ms:s.ms};});
  const all=[...units,...groups];
  const sum=k=>all.reduce((a,x)=>a+x[k],0);
  const grand={w:sum('w'),c:sum('c'),m:sum('m'),tot:sum('tot')};
  const sheets={w:sum('ws'),c:sum('cs'),m:sum('ms')};
  const nUnits=units.reduce((a,x)=>a+x.n,0);
  const k=1+(+A.waste||0);
  const mats=p.mats.map(m=>{
    const basis=m.basis==='clg'?grand.c:m.basis==='wallsmr'?grand.w+grand.m:grand.w+grand.c+grand.m;
    const qty=ru(basis*(+m.rate||0)*k);return{...m,basisVal:basis,qty,packs:ru(qty/(+m.pack||1))};
  });
  return{units,groups,grand,sheets,nUnits,mats};
}

/* ---------- local storage only; no remote backend ---------- */
let projects={},currentId=null,tab='units',saveTimer=null;
let active={units:null,common:null},loaded=true;
function setStatus(kind,text){const el=$('#status');el.className='status '+kind;el.querySelector('span').textContent=text;}
let storageFailed=false;
function lsRead(){
  try{const raw=localStorage.getItem(LS_KEY);const data=JSON.parse(raw||'{}');
    if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Invalid storage');
    Object.keys(data).forEach(id=>{if(data[id]&&typeof data[id]==='object')normalize(data[id]);else delete data[id];});return data;
  }catch(e){storageFailed=true;return {};}
}
function lsWrite(){
  // Preserve unreadable existing storage instead of silently overwriting it.
  if(storageFailed){setStatus('local','Saved data could not be read. Changes will not be saved.');return false;}
  try{localStorage.setItem(LS_KEY,JSON.stringify(projects));return true;}
  catch(e){setStatus('local','Could not save: export Excel before closing.');return false;}
}
function initStore(){projects=lsRead();if(storageFailed)setStatus('local','Saved data could not be read. Changes will not be saved.');else setStatus('local','Saved on this device only');render();}
const clean=p=>JSON.parse(JSON.stringify(p));
function touch(){const p=projects[currentId];if(!p)return false;p.updatedAt=Date.now();if(lsWrite()){setStatus('local','Saved on this device only');return true;}return false;}
async function removeProject(id){delete projects[id];if(lsWrite())setStatus('local','Saved on this device only');}

/* ---------- containers (unit types / common-area groups) ---------- */
function ctrList(p,t){return p[CTR[t]];}
function activeCtr(p,t){
  const list=ctrList(p,t);
  let c=list.find(x=>x.id===active[t]);
  if(!c&&list.length){c=list[0];active[t]=c.id;}
  return c||null;
}
function locate(id){
  const p=projects[currentId];
  for(const c of [...p.unitTypes,...p.groups]){const i=c.rooms.findIndex(r=>r.id===id);if(i>=0)return{list:c.rooms,idx:i,ctr:c};}
  return null;
}
const findRoom=id=>{const l=locate(id);return l?l.list[l.idx]:null;};

/* ---------- rendering ---------- */
function render(){
  const p=projects[currentId];
  $('#backBtn').hidden=!p;$('#tabs').hidden=!p;$('#bar').hidden=!p;
  $('#pname').textContent=p?'· '+(p.name||'Untitled'):'';
  if(!p){renderHome();return;}
  renderTabs(p);
  const m=$('#main');
  if(tab==='project')m.innerHTML=projectHTML(p);
  else if(tab==='summary')m.innerHTML=summaryHTML(p);
  else m.innerHTML=sectionHTML(p,tab);
  refreshAll();
}
function renderTabs(p){
  const nRooms=l=>l.reduce((a,c)=>a+c.rooms.length,0);
  const t=[['project','Project',''],['units','Unit types',p.unitTypes.length],['common','Common areas',nRooms(p.groups)],['summary','Summary','']];
  $('#tabs').innerHTML=t.map(([k,l,c])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}${c!==''?`<span class="count">${c}</span>`:''}</button>`).join('');
}
function renderHome(){
  const list=Object.entries(projects).filter(([,p])=>p&&!p._deleted).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  $('#main').innerHTML=`
  <div class="sec-head"><div><h2>Projects</h2><p>Each project is one takeoff: unit types, common areas by level or building, and materials.</p></div><div class="spacer"></div>
  <button class="btn primary" data-act="newp">+ New project</button></div>
  ${list.length?`<div class="plist">${list.map(([id,p])=>{normalize(p);const c=projCalc(p);const nCommon=p.groups.reduce((a,g)=>a+g.rooms.length,0);return`
    <div class="pcard">
      <h3>${esc(p.name||'Untitled')}</h3>
      <div class="meta">${esc([p.address,p.levels].filter(Boolean).join(' · ')||'No address')}</div>
      <div class="meta">${fmt(c.nUnits)} units in ${p.unitTypes.length} type${p.unitTypes.length===1?'':'s'} · ${nCommon} common areas in ${p.groups.length} group${p.groups.length===1?'':'s'}</div>
      <div><span class="big">${fmt0(c.grand.tot)}</span> <span class="meta">sheets</span></div>
      <div class="row"><button class="btn primary sm" data-open="${id}">Open</button><button class="btn sm" data-dupp="${id}">Duplicate</button><button class="btn sm danger" data-delp="${id}">Delete</button></div>
    </div>`;}).join('')}</div>`
  :!loaded?`<div class="empty"><p><b>Loading projects…</b></p></div>`:`<div class="empty"><p><b>No projects yet.</b></p><p>Tap “New project” to start a takeoff. It saves automatically as you type.</p></div>`}`;
}

function refreshAll(){
  const p=projects[currentId];if(!p)return;
  const A=p.assume;
  document.querySelectorAll('.room').forEach(el=>{
    const loc=locate(el.dataset.id);if(!loc)return;
    const r=loc.list[loc.idx],hd=loc.ctr.h,hdv=parseLen(hd);
    const c=roomCalc(r,A,hd);
    const set=(k,v)=>{const o=el.querySelector(`[data-o="${k}"]`);if(o)o.textContent=v;};
    set('per',fmt0(c.per));set('tot',fmt0(c.tot));
    set('sum',[c.w&&`W ${fmt(c.w)}`,c.c&&`C ${fmt(c.c)}`,c.m&&`MR ${fmt(c.m)}`].filter(Boolean).join(' · ')+(c.w||c.c||c.m?' ft²':''));
    set('w',fmt(c.w));set('c',fmt(c.c));set('m',fmt(c.m));
    if(r.mode==='dim'){
      const show=raw=>{const v=parseLen(raw);return String(raw||'').trim()?(v?`= ${lenTxt(v)}`:'Not a length'):'';};
      set('Lx',show(r.L));set('Wx',show(r.W));set('Hx',String(r.H||'').trim()?show(r.H)+' (this room only)':`Using ${lenTxt(hdv||+A.h)} from ${hdv?esc(loc.ctr.name||'this group'):'project'}`);
    }
    const ex=(f,sf,sh)=>{const raw=r[f];return(r.mode!=='dim'&&isExpr(raw)?`= ${fmt(sf)} ft² · `:'')+(sf?`${sh} sheets`:'');};
    set('wsx',r.mode==='dim'?(c.w?c.ws+' sheets':''):ex('walls',c.w,c.ws));
    set('csx',r.mode==='dim'?(c.c?c.cs+' sheets':''):ex('clg',c.c,c.cs));
    set('msx',r.mode==='dim'?(c.m?c.ms+' sheets':''):ex('mr',c.m,c.ms));
  });
  const t=projCalc(p);
  $('#k-tot').textContent=fmt0(t.grand.tot);$('#k-w').textContent=fmt0(t.sheets.w);$('#k-c').textContent=fmt0(t.sheets.c);$('#k-m').textContent=fmt0(t.sheets.m);
  $('#pname').textContent='· '+(p.name||'Untitled');
  if(tab==='units'||tab==='common'){
    const cur=activeCtr(p,tab);
    if(cur){const s=secCalc(cur.rooms,A,cur.h);const per=$('#ctrPer');if(per)per.textContent=fmt0(s.tot);const all=$('#ctrAll');if(all)all.textContent=fmt0(s.tot*val(cur.count));}
  }
  const sT=$('#sumT');
  if(sT){
    const row=(name,n,x)=>`<tr><td>${esc(name)}</td><td class="num">${n}</td><td class="num">${fmt(x.w)}</td><td class="num">${fmt(x.c)}</td><td class="num">${fmt(x.m)}</td><td class="num">${fmt0(x.tot)}</td></tr>`;
    sT.innerHTML=`<thead><tr><th>Area</th><th># of Units</th><th>ft² Walls</th><th>ft² Ceiling</th><th>ft² MR</th><th>Total Sheets</th></tr></thead><tbody>
      ${t.units.map(x=>row(x.u.name||'Unit type',fmt(x.n),x)).join('')}
      ${t.groups.map(x=>row('Common Areas – '+(x.g.name||'Group'),'N/A',x)).join('')}
      <tr class="grand"><td>GRAND TOTAL</td><td class="num">${fmt(t.nUnits)}</td><td class="num">${fmt(t.grand.w)}</td><td class="num">${fmt(t.grand.c)}</td><td class="num">${fmt(t.grand.m)}</td><td class="num">${fmt0(t.grand.tot)}</td></tr></tbody>`;
  }
  const mT=$('#matT');
  if(mT){
    if(!mT.dataset.built){
      mT.innerHTML=`<thead><tr><th>Material</th><th>Basis ft²</th><th>Usage Rate</th><th>Rate Unit</th><th>Qty (+ waste)</th><th>Pack Size</th><th>Pack Unit</th><th>Packs to Order</th></tr></thead><tbody>${p.mats.map((m,i)=>`
        <tr><td>${esc(m.name)}</td><td class="num" data-mo="${i}-b"></td><td><input class="num" id="m-${i}-rate" data-m="${i}.rate" inputmode="decimal" value="${esc(m.rate)}"></td><td>${esc(m.rateUnit)}</td>
        <td class="num" data-mo="${i}-q"></td><td><input class="num" id="m-${i}-pack" data-m="${i}.pack" inputmode="decimal" value="${esc(m.pack)}"></td><td>${esc(m.packUnit)}</td><td class="num"><b data-mo="${i}-p"></b></td></tr>`).join('')}</tbody>`;
      mT.dataset.built='1';
    }
    t.mats.forEach((m,i)=>{
      mT.querySelector(`[data-mo="${i}-b"]`).textContent=fmt(m.basisVal);
      mT.querySelector(`[data-mo="${i}-q"]`).textContent=fmt0(m.qty)+' '+m.qtyUnit;
      mT.querySelector(`[data-mo="${i}-p"]`).textContent=fmt0(m.packs);
    });
  }
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const el=e.target,p=projects[currentId];if(!p)return;
  if(el.dataset.p){p[el.dataset.p]=el.value;}
  else if(el.dataset.a){p.assume[el.dataset.a]=el.dataset.a==='waste'?(val(el.value)/100):val(el.value);}
  else if(el.dataset.m){const[i,k]=el.dataset.m.split('.');p.mats[+i][k]=val(el.value);}
  else if(el.dataset.c){const cur=activeCtr(p,tab);if(!cur)return;cur[el.dataset.c]=el.value;$('#ctrBar').innerHTML=ctrBarHTML(p,tab);}
  else if(el.dataset.f){const room=el.closest('.room');const r=findRoom(room.dataset.id);r[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;}
  else return;
  refreshAll();touch();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  e.preventDefault();
  const ins=[...document.querySelectorAll('#main input:not([type=checkbox])')];
  const i=ins.indexOf(e.target);
  if(i>=0&&i<ins.length-1){ins[i+1].focus();ins[i+1].select&&ins[i+1].select();}
  else e.target.blur();
});
function arm(b,label,restore,cls){
  if(b.dataset.armed)return true;
  b.dataset.armed='1';const old=b.textContent;b.textContent=label;b.classList.add(cls);
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=restore??old;b.classList.remove(cls);}},3000);
  return false;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return;}
  if(b.id==='backBtn'){currentId=null;render();return;}
  if(b.id==='exportBtn'||b.dataset.act==='export'){exportXlsx();return;}
  if(b.dataset.act==='newp'){const id=uid();projects[id]=newProject();currentId=id;tab='project';active={units:null,common:null};touch();render();setTimeout(()=>{const n=$('#p-name');n&&(n.focus(),n.select());},50);return;}
  if(b.dataset.open){currentId=b.dataset.open;active={units:null,common:null};if(normalize(projects[currentId]))touch();tab='units';render();window.scrollTo(0,0);return;}
  if(b.dataset.dupp){const id=uid();const c=clean(projects[b.dataset.dupp]);normalize(c);c.name=(c.name||'')+' (copy)';c.updatedAt=Date.now();[...c.unitTypes,...c.groups].forEach(x=>{x.id=uid();x.rooms.forEach(r=>r.id=uid());});projects[id]=c;currentId=id;touch();currentId=null;render();toast('Project duplicated');return;}
  if(b.dataset.delp){if(arm(b,'Sure? Tap again','Delete','primary')){await removeProject(b.dataset.delp);render();toast('Project deleted');}return;}
  const p=projects[currentId];if(!p)return;
  if(b.dataset.ctr){active[tab]=b.dataset.ctr;render();return;}
  if(b.dataset.act==='addctr'){
    const list=ctrList(p,tab);
    const c=tab==='units'?newUnitType('Unit '+String.fromCharCode(65+Math.min(list.length,25)),'1'):newGroup('Level '+(list.length+1));
    list.push(c);active[tab]=c.id;touch();render();
    setTimeout(()=>{const n=$('#c-name');n&&(n.focus(),n.select());},50);return;
  }
  if(b.dataset.act==='dupctr'){
    const list=ctrList(p,tab),cur=activeCtr(p,tab);if(!cur)return;
    const c=clean(cur);c.id=uid();c.name=(c.name||'')+' (copy)';c.rooms.forEach(r=>r.id=uid());
    list.splice(list.indexOf(cur)+1,0,c);active[tab]=c.id;touch();render();toast('Duplicated — rename it and adjust');
    setTimeout(()=>{const n=$('#c-name');n&&(n.focus(),n.select());},50);return;
  }
  if(b.dataset.act==='delctr'){
    if(!arm(b,'Sure? Tap again',null,'primary'))return;
    const list=ctrList(p,tab),cur=activeCtr(p,tab);if(!cur)return;
    list.splice(list.indexOf(cur),1);active[tab]=null;touch();render();toast(`${cur.name||'Group'} deleted`);return;
  }
  if(b.dataset.chip||b.dataset.act==='add'){addRoom(p,b.dataset.chip||'');return;}
  const room=b.closest('.room');if(!room)return;
  const id=room.dataset.id,loc=locate(id);if(!loc)return;
  const list=loc.list,idx=loc.idx;
  if(b.dataset.act==='done'||b.dataset.act==='donenext'){
    const r=list[idx];
    if(!String(r.name||'').trim()){const n=document.getElementById(`r-${r.id}-name`);n&&n.focus();toast('Name the room before saving it');return;}
    r.done=true;if(!touch()){r.done=false;toast('Could not save. Export Excel before closing.');return;}
    room.outerHTML=roomHTML(r);refreshAll();
    toast(`${r.name} saved ✓`);
    if(b.dataset.act==='donenext')addRoom(p,'');
    return;
  }
  if(b.dataset.act==='edit'){
    list[idx].done=false;touch();room.outerHTML=roomHTML(list[idx]);refreshAll();
    const n=document.getElementById(`r-${id}-qty`);n&&n.focus();return;
  }
  if(b.dataset.mode){list[idx].mode=b.dataset.mode;touch();room.outerHTML=roomHTML(list[idx]);refreshAll();return;}
  if(b.dataset.act==='dup'){const c={...clean(list[idx]),id:uid(),done:false};list.splice(idx+1,0,c);touch();renderTabs(p);$('#ctrBar')&&($('#ctrBar').innerHTML=ctrBarHTML(p,tab));room.insertAdjacentHTML('afterend',roomHTML(c));refreshAll();toast('Room duplicated');return;}
  if(b.dataset.act==='del'){
    if(arm(b,'Delete','✕','confirm')){list.splice(idx,1);touch();renderTabs(p);$('#ctrBar')&&($('#ctrBar').innerHTML=ctrBarHTML(p,tab));room.remove();if(!list.length)$('#rooms').innerHTML=emptyRooms();refreshAll();}
  }
});
function addRoom(p,name){
  const cur=activeCtr(p,tab);if(!cur)return;
  const r=newRoom(name);cur.rooms.push(r);touch();renderTabs(p);
  const bar=$('#ctrBar');if(bar)bar.innerHTML=ctrBarHTML(p,tab);
  const wrap=$('#rooms');if(!wrap)return;
  if(wrap.querySelector('.empty'))wrap.innerHTML='';
  wrap.insertAdjacentHTML('beforeend',roomHTML(r));refreshAll();
  const el=document.getElementById(name?`r-${r.id}-qty`:`r-${r.id}-name`);
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.focus();el.select&&el.select();}
}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}

/* ---------- Excel export (Template layout, one block per unit type and per level/building, live formulas) ---------- */
async function exportXlsx(){
  const p=projects[currentId];if(!p)return;
  if(!window.ExcelJS){toast('The Excel generator did not load. Check your connection.');return;}
  const A=p.assume,t=projCalc(p);
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Takeoff',{views:[{showGridLines:false}]});
  ws.columns=[{width:3},{width:34},{width:12},{width:13},{width:13},{width:13},{width:13},{width:13},{width:26},{width:14},{width:14},{width:26}];
  const thin={style:'thin',color:{argb:'FFBFC6CE'}};const box={top:thin,left:thin,bottom:thin,right:thin};
  const hdrFill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F2A36'}};
  const subFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7EBF0'}};
  const inFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF8DC'}};
  const C=(addr,v)=>{const c=ws.getCell(addr);c.value=v;return c;};
  const F=(addr,f,r)=>{const c=ws.getCell(addr);c.value={formula:f,result:r};return c;};
  const header=(row,labels)=>{labels.forEach((l,i)=>{const c=ws.getCell(row,2+i);c.value=l;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill=hdrFill;c.border=box;c.alignment={wrapText:true,vertical:'middle',horizontal:i?'center':'left'};});ws.getRow(row).height=30;};
  const title=(row,txt)=>{const c=C('B'+row,txt);c.font={bold:true,size:13};};

  F('B2','IF(C4="","Project Takeoff","Takeoff – "&C4)','Takeoff – '+p.name).font={bold:true,size:16};
  [['Project',p.name],['Address',p.address],['Levels / Scope',p.levels],['Drawings / Scale',p.drawings],['Date',p.date]].forEach(([l,v],i)=>{C('B'+(4+i),l).font={bold:true};const c=C('C'+(4+i),v||null);c.border={bottom:thin};});
  C('I4','Assumptions').font={bold:true};C('K4','Value').font={bold:true};
  [['Sheet Size – Walls (ft²)',+A.wall],['Sheet Size – Ceiling (ft²)',+A.clg],['Sheet Size – MR (ft²)',+A.mr],['Waste Factor',+A.waste],['Ceiling Height (ft)',+A.h]].forEach(([l,v],i)=>{C('I'+(5+i),l);const c=C('K'+(5+i),v);c.fill=inFill;c.border=box;if(i===3)c.numFmt='0%';});
  C('I10','Sheets = ROUNDUP(ft² ÷ Sheet Size × (1 + Waste))').font={italic:true,color:{argb:'FF5A6775'}};

  // Row plan
  const blocks=[
    ...p.unitTypes.map(u=>({kind:'unit',name:u.name||'Unit type',count:val(u.count),h:u.h,rooms:u.rooms.length?u.rooms:[newRoom('')]})),
    ...p.groups.map(g=>({kind:'group',name:g.name||'Group',h:g.h,rooms:g.rooms.length?g.rooms:[newRoom('')]}))
  ];
  const sumStart=13,grand=sumStart+blocks.length;
  let r0=grand+2;
  blocks.forEach(b=>{b.title=r0;b.hdr=r0+1;b.start=r0+2;b.end=b.start+b.rooms.length-1;b.sub=b.end+1;r0=b.sub+2;});
  const mTitle=r0,mHdr=mTitle+1,mStart=mHdr+1;

  title(11,'Project Summary');
  header(12,['Area','# of Units','ft² Walls','ft² Ceiling','ft² MR','Total Sheets','Sheet Size']);
  const sz=`"Walls "&$K$5&" / Clg "&$K$6&" / MR "&$K$7&" ft²"`,szR=`Walls ${A.wall} / Clg ${A.clg} / MR ${A.mr} ft²`;
  blocks.forEach((b,i)=>{
    const row=sumStart+i,s=secCalc(b.rooms,A,b.h);
    if(b.kind==='unit'){
      C('B'+row,b.name);const c=C('C'+row,b.count);c.fill=inFill;
      F('D'+row,`$C${row}*D${b.sub}`,b.count*s.w);F('E'+row,`$C${row}*F${b.sub}`,b.count*s.c);F('F'+row,`$C${row}*H${b.sub}`,b.count*s.m);F('G'+row,`$C${row}*K${b.sub}`,b.count*s.tot);
    }else{
      C('B'+row,'Common Areas – '+b.name);C('C'+row,'N/A');
      F('D'+row,`D${b.sub}`,s.w);F('E'+row,`F${b.sub}`,s.c);F('F'+row,`H${b.sub}`,s.m);F('G'+row,`K${b.sub}`,s.tot);
    }
    F('H'+row,sz,szR);
  });
  const last=grand-1;
  C('B'+grand,'GRAND TOTAL');
  if(blocks.length){
    F('C'+grand,`SUM(C${sumStart}:C${last})`,t.nUnits);F('D'+grand,`SUM(D${sumStart}:D${last})`,t.grand.w);F('E'+grand,`SUM(E${sumStart}:E${last})`,t.grand.c);F('F'+grand,`SUM(F${sumStart}:F${last})`,t.grand.m);F('G'+grand,`SUM(G${sumStart}:G${last})`,t.grand.tot);
  }
  for(let r=sumStart;r<=grand;r++)for(let c=2;c<=8;c++){const cell=ws.getCell(r,c);cell.border=box;if(c>=4&&c<=6)cell.numFmt='#,##0.0';if(c===7)cell.numFmt='#,##0';}
  for(let c=2;c<=8;c++){ws.getCell(grand,c).font={bold:true};ws.getCell(grand,c).fill=subFill;}

  const roomHdr=['Room','Qty','ft² Walls','Walls (sheets)','ft² Ceiling','Ceiling (sheets)','ft² MR','MR (sheets)','Sheets / Room','Total Sheets','Measurements'];
  blocks.forEach(b=>{
    const hTxt=parseLen(b.h)?` · ceiling ${lenTxt(parseLen(b.h))}`:'';
    title(b.title,(b.kind==='unit'?`${b.name} — measurements per ONE unit (× ${fmt(b.count)} units)`:`Common Areas — ${b.name}`)+hTxt);
    header(b.hdr,roomHdr);
    b.rooms.forEach((r,i)=>{
      const row=b.start+i,c=roomCalc(r,A,b.h);
      C('B'+row,r.name||null);C('C'+row,c.q);
      C('D'+row,c.w||null);F('E'+row,`ROUNDUP(D${row}/$K$5*(1+$K$8),0)`,c.ws);
      C('F'+row,c.c||null);F('G'+row,`ROUNDUP(F${row}/$K$6*(1+$K$8),0)`,c.cs);
      C('H'+row,c.m||null);F('I'+row,`ROUNDUP(H${row}/$K$7*(1+$K$8),0)`,c.ms);
      F('J'+row,`E${row}+G${row}+I${row}`,c.per);F('K'+row,`C${row}*J${row}`,c.tot);
      if(r.mode==='dim')C('L'+row,`${lenTxt(c.L)} × ${lenTxt(c.W)} × h ${lenTxt(c.H)}${r.mrWalls?' (MR walls)':''}`);
      else{const parts=[['W',r.walls],['C',r.clg],['MR',r.mr]].filter(([,v])=>isExpr(v)).map(([k,v])=>`${k}: ${v}`);if(parts.length)C('L'+row,parts.join('  '));}
      for(let cc=2;cc<=12;cc++){const cell=ws.getCell(row,cc);cell.border=box;if([3,4,6,8].includes(cc))cell.fill=inFill;if([4,6,8].includes(cc))cell.numFmt='#,##0.0';}
      ws.getCell('L'+row).font={color:{argb:'FF5A6775'},size:9};
    });
    const s=secCalc(b.rooms,A,b.h),st=b.start,en=b.end,sub=b.sub;
    C('B'+sub,'SUB-TOTAL');F('C'+sub,`SUM(C${st}:C${en})`,s.q);
    [['D',s.w],['E',s.ws],['F',s.c],['G',s.cs],['H',s.m],['I',s.ms],['J',s.per]].forEach(([L,v])=>F(L+sub,`SUMPRODUCT($C${st}:$C${en},${L}${st}:${L}${en})`,v));
    F('K'+sub,`SUM(K${st}:K${en})`,s.tot);
    for(let cc=2;cc<=11;cc++){const cell=ws.getCell(sub,cc);cell.font={bold:true};cell.fill=subFill;cell.border=box;if([4,6,8].includes(cc))cell.numFmt='#,##0.0';}
  });

  title(mTitle,'Materials');
  header(mHdr,['Material','Basis ft²','Usage Rate','Rate Unit','Qty (+ waste)','Qty Unit','Pack Size','Pack Unit','Packs to Order']);
  t.mats.forEach((m,i)=>{
    const row=mStart+i;
    const bf=m.basis==='clg'?`E${grand}`:m.basis==='wallsmr'?`D${grand}+F${grand}`:`SUM(D${grand}:F${grand})`;
    C('B'+row,m.name);F('C'+row,bf,m.basisVal);C('D'+row,+m.rate).fill=inFill;C('E'+row,m.rateUnit);
    F('F'+row,`ROUNDUP(C${row}*D${row}*(1+$K$8),0)`,m.qty);C('G'+row,m.qtyUnit);C('H'+row,+m.pack).fill=inFill;C('I'+row,m.packUnit);
    F('J'+row,`ROUNDUP(F${row}/H${row},0)`,m.packs).font={bold:true};
    for(let cc=2;cc<=10;cc++)ws.getCell(row,cc).border=box;
    ws.getCell('C'+row).numFmt='#,##0.0';ws.getCell('F'+row).numFmt='#,##0';
  });
  ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};

  try{
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const fname=`Takeoff - ${(p.name||'Project').replace(/[\\/:*?"<>|]/g,'-')}.xlsx`;
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download=fname;
    document.body.appendChild(link);link.click();link.remove();
    // Safari may still be consuming the URL after the click.
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast('Excel generated. Check Downloads in Safari.');
  }catch(err){console.error('Excel export failed',err);toast('Could not generate Excel. Try again.');}
}

window.__takeoffTest={parseLen,lenTxt};
render();initStore();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js').catch(err=>{console.error(err);toast('Offline mode could not start. Reload while online.');});
}
})();
</script>
