<style>
/* Layout: field tablet tool — sticky header + tabs, stacked room cards, sticky totals bar at the bottom. Surface colors follow the board: grey = regular, blue = ceiling, green = MR (green board). */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f5f7f9; --ink:#16202a; --muted:#5a6775; --line:#d2d8df;
  --accent:#1f56c3; --accent-ink:#ffffff; --wall:#5f6b79; --clg:#2a66d0; --mr:#2b8a4b; --danger:#b42318;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --surface2:#151b22; --ink:#e5eaf0; --muted:#94a1ae; --line:#2b3540;
  --accent:#6f9cff; --accent-ink:#0d1420; --wall:#a3aebb; --clg:#77a3ff; --mr:#5fc782; --danger:#ff7b6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --surface2:#151b22; --ink:#e5eaf0; --muted:#94a1ae; --line:#2b3540;
  --accent:#6f9cff; --accent-ink:#0d1420; --wall:#a3aebb; --clg:#77a3ff; --mr:#5fc782; --danger:#ff7b6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
input:focus{border-color:var(--accent)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--wall) 0 33%,var(--clg) 33% 66%,var(--mr) 66%);flex:none}
.brand span.pname{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mr);display:inline-block}
.status.busy i{background:var(--clg)} .status.local i{background:#c98a12}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:46px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}

.tabs{display:flex;gap:4px;padding-block:0 10px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:9px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--muted);white-space:nowrap;min-height:44px}
.tabs button.on{background:var(--ink);color:var(--surface)}
.tabs .count{font-family:var(--f-num);font-size:13px;opacity:.7;margin-left:4px}

main{padding-block:18px 150px}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
.sec-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:15px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel + .panel{margin-top:14px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px dashed var(--line);background:var(--surface2);border-radius:999px;padding:8px 14px;min-height:42px;font-weight:500}
.chip b{color:var(--accent);margin-right:4px}

.rooms{display:flex;flex-direction:column;gap:10px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.room-head{display:grid;grid-template-columns:minmax(0,1fr) 92px auto auto;gap:8px;align-items:end}
.room-head .rname{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:46px}
.seg button{border:0;background:var(--surface2);padding:0 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.racts{display:flex;gap:6px}
.icon-btn{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:18px}
.icon-btn.confirm{background:var(--danger);color:#fff;border-color:var(--danger);width:auto;padding:0 12px;font-size:14px;font-weight:600}
.surfaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.surf{display:flex;flex-direction:column;gap:5px;min-width:0;border-left:4px solid var(--c);padding-left:8px}
.surf .lbl{color:var(--c)}
.surf .calc{font-size:13px;color:var(--muted);min-height:18px;font-family:var(--f-num)}
.s-w{--c:var(--wall)} .s-c{--c:var(--clg)} .s-m{--c:var(--mr)}
.toggle{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--mr)}
.room-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.room-foot b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.room-foot .tot{margin-left:auto;font-size:15px}
.room-foot .tot b{font-size:18px;color:var(--accent)}
.add-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.grand td{font-weight:700;background:var(--surface2)}
td input{min-height:38px;padding:6px 8px;width:90px;text-align:right}

.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pcard h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.pcard .meta{color:var(--muted);font-size:14px}
.pcard .big{font-family:var(--f-num);font-size:24px;font-weight:600;color:var(--accent)}
.pcard .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;line-height:1.1}
.kpi b{font-family:var(--f-num);font-size:22px;font-weight:600}
.kpi.main b{font-size:30px;color:var(--accent)}
.kpi .lbl{font-size:11px}
.kpi.w .lbl{color:var(--wall)} .kpi.c .lbl{color:var(--clg)} .kpi.m .lbl{color:var(--mr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}

@media (max-width:640px){
  .room-head{grid-template-columns:minmax(0,1fr) 80px}
  .room-head .seg,.room-head .racts{grid-column:span 1}
  .surfaces,.dims{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bar .wrap{gap:12px}
  .kpi.main b{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){.room{transition:border-color .15s}}
.room:focus-within{border-color:var(--accent)}
</style>

<script src="./vendor/exceljs.min.js"></script>
<script>
(function(){
const LS_KEY='takeoff_drywall_v1';
const DEF_ASSUME={wall:54,clg:48,mr:48,waste:0.05,h:9};
const DEF_MATS=[
 {name:"Channel (hat / RC) — 12' pcs",basis:'clg',rate:0.75,rateUnit:'LF per ft² (16" o.c.)',qtyUnit:'LF',pack:12,packUnit:'LF / piece'},
 {name:'Screws fine thread — ceilings (to metal channel)',basis:'clg',rate:1.25,rateUnit:'screws per ft²',qtyUnit:'screws',pack:8000,packUnit:'screws / 25 lb bucket'},
 {name:'Screws coarse thread — walls (to wood studs)',basis:'wallsmr',rate:1,rateUnit:'screws per ft²',qtyUnit:'screws',pack:8000,packUnit:'screws / 25 lb bucket'},
 {name:'Joint compound (mezcla)',basis:'all',rate:0.138,rateUnit:'lb per ft²',qtyUnit:'lb',pack:62,packUnit:'lb / 4.5 gal box'},
 {name:'Fire tape',basis:'all',rate:0.37,rateUnit:'LF per ft²',qtyUnit:'LF',pack:500,packUnit:'LF / roll'}
];
const CHIPS={
  typical:['Bedroom','Bathroom','Kitchen','Living / Dining','Closet','Hallway','Laundry','Entry'],
  common:['Corridor','Stair','Lobby','Elevator Lobby','Trash Room','Mech / Elec','Mail Room','Amenity','Restroom']
};
const MR_HINT=/bath|restroom|laundry|trash/i;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*10)/10).toLocaleString('en-US');
const fmt0=n=>Math.round(n).toLocaleString('en-US');
function ru(x){if(!(x>0))return 0;return Math.ceil(Math.round(x*1e9)/1e9);}
// tiny safe arithmetic evaluator: + - * / x ( )
function evalExpr(s){
  s=String(s??'').trim().replace(/,/g,'.').replace(/[x×]/gi,'*');
  if(!s)return 0;
  let i=0;const peek=()=>s[i];const ws=()=>{while(s[i]===' ')i++;};
  function num(){ws();let st=i;while(/[0-9.]/.test(s[i]||''))i++;if(st===i)throw 0;return parseFloat(s.slice(st,i));}
  function fac(){ws();if(peek()==='('){i++;const v=expr();ws();if(peek()!==')')throw 0;i++;return v;}if(peek()==='-'){i++;return -fac();}return num();}
  function term(){let v=fac();for(;;){ws();const c=peek();if(c==='*'){i++;v*=fac();}else if(c==='/'){i++;const d=fac();v=d?v/d:0;}else return v;}}
  function expr(){let v=term();for(;;){ws();const c=peek();if(c==='+'){i++;v+=term();}else if(c==='-'){i++;v-=term();}else return v;}}
  try{const v=expr();ws();if(i<s.length)return NaN;return v;}catch(e){return NaN;}
}
const val=s=>{const v=evalExpr(s);return isFinite(v)?v:0;};
const isExpr=s=>/[+\-*/x×()]/i.test(String(s||'').replace(/^\s*-/,''));
// lengths: 12'6"  12-6  12 6  12'  12.5
function parseLen(s){
  s=String(s??'').trim();if(!s)return 0;
  const m=s.match(/^(\d+(?:[.,]\d+)?)\s*(?:'|ft|-|\s)\s*(\d+(?:[.,]\d+)?)?\s*(?:"|''|in)?$/i);
  if(m)return parseFloat(m[1].replace(',','.'))+(m[2]?parseFloat(m[2].replace(',','.'))/12:0);
  const n=parseFloat(s.replace(',','.'));return isNaN(n)?0:n;
}
const lenTxt=n=>{if(!n)return '';const f=Math.floor(n+1e-9);const inch=Math.round((n-f)*12);return inch?`${f}'${inch}"`:`${f}'`;};

/* ---------- model ---------- */
function newRoom(name=''){return{id:uid(),name,qty:'1',mode:'sf',walls:'',clg:'',mr:'',L:'',W:'',H:'',mrWalls:MR_HINT.test(name)};}
function newProject(){
  return{name:'Proyecto nuevo',address:'',levels:'',drawings:'',date:new Date().toISOString().slice(0,10),
    units:'1',assume:{...DEF_ASSUME},typical:[newRoom('')],common:[],mats:DEF_MATS.map(m=>({...m})),updatedAt:Date.now()};
}
function normalize(p){
  p.assume={...DEF_ASSUME,...(p.assume||{})};
  p.typical=Array.isArray(p.typical)?p.typical:[];p.common=Array.isArray(p.common)?p.common:[];
  if(!Array.isArray(p.mats)||!p.mats.length)p.mats=DEF_MATS.map(m=>({...m}));
  return p;
}
function roomSF(r,A){
  const q=val(r.qty);
  if(r.mode==='dim'){
    const L=parseLen(r.L),W=parseLen(r.W),H=parseLen(r.H)||+A.h||0;
    const wallSF=2*(L+W)*H,clg=L*W;
    return{q,w:r.mrWalls?0:wallSF,c:clg,m:r.mrWalls?wallSF:0,L,W,H};
  }
  return{q,w:val(r.walls),c:val(r.clg),m:val(r.mr)};
}
function roomCalc(r,A){
  const s=roomSF(r,A),k=1+(+A.waste||0);
  const ws=ru(s.w/(+A.wall||1)*k),cs=ru(s.c/(+A.clg||1)*k),ms=ru(s.m/(+A.mr||1)*k);
  const per=ws+cs+ms;return{...s,ws,cs,ms,per,tot:s.q*per};
}
function secCalc(list,A){
  const t={q:0,w:0,c:0,m:0,ws:0,cs:0,ms:0,per:0,tot:0};
  list.forEach(r=>{const c=roomCalc(r,A);t.q+=c.q;t.w+=c.q*c.w;t.c+=c.q*c.c;t.m+=c.q*c.m;t.ws+=c.q*c.ws;t.cs+=c.q*c.cs;t.ms+=c.q*c.ms;t.per+=c.q*c.per;t.tot+=c.tot;});
  return t;
}
function projCalc(p){
  const A=p.assume,u=val(p.units);
  const ts=secCalc(p.typical,A),cs=secCalc(p.common,A);
  const typ={w:u*ts.w,c:u*ts.c,m:u*ts.m,tot:u*ts.tot};
  const grand={w:typ.w+cs.w,c:typ.c+cs.c,m:typ.m+cs.m,tot:typ.tot+cs.tot};
  const sheets={w:u*ts.ws+cs.ws,c:u*ts.cs+cs.cs,m:u*ts.ms+cs.ms};
  const k=1+(+A.waste||0);
  const mats=p.mats.map(m=>{
    const basis=m.basis==='clg'?grand.c:m.basis==='wallsmr'?grand.w+grand.m:grand.w+grand.c+grand.m;
    const qty=ru(basis*(+m.rate||0)*k);return{...m,basisVal:basis,qty,packs:ru(qty/(+m.pack||1))};
  });
  return{u,ts,cs,typ,grand,sheets,mats};
}

/* ---------- local storage only; no remote backend ---------- */
let projects={},currentId=null,tab='typical',saveTimer=null;
function setStatus(kind,text){const el=$('#status');el.className='status '+kind;el.querySelector('span').textContent=text;}
let storageFailed=false;
function lsRead(){
  try{const raw=localStorage.getItem(LS_KEY);const data=JSON.parse(raw||'{}');
    if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Invalid storage');
    Object.values(data).forEach(normalize);return data;
  }catch(e){storageFailed=true;return {};}
}
function lsWrite(){
  // Preserve unreadable existing storage instead of silently overwriting it.
  if(storageFailed){setStatus('local','No se pudo leer el guardado. No se guardarán cambios.');return false;}
  try{localStorage.setItem(LS_KEY,JSON.stringify(projects));return true;}
  catch(e){setStatus('local','No se pudo guardar: exporta Excel antes de cerrar.');return false;}
}
function initStore(){projects=lsRead();if(storageFailed)setStatus('local','No se pudo leer el guardado. No se guardarán cambios.');else setStatus('local','Guardado solo en este dispositivo');render();}
const clean=p=>JSON.parse(JSON.stringify(p));
function touch(){const p=projects[currentId];if(!p)return;p.updatedAt=Date.now();if(lsWrite())setStatus('local','Guardado solo en este dispositivo');}
async function removeProject(id){delete projects[id];if(lsWrite())setStatus('local','Guardado solo en este dispositivo');}

/* ---------- rendering ---------- */
function render(){
  const p=projects[currentId];
  $('#backBtn').hidden=!p;$('#tabs').hidden=!p;$('#bar').hidden=!p;
  $('#pname').textContent=p?'· '+(p.name||'Sin nombre'):'';
  if(!p){renderHome();return;}
  renderTabs(p);
  const m=$('#main');
  if(tab==='project')m.innerHTML=projectHTML(p);
  else if(tab==='summary')m.innerHTML=summaryHTML(p);
  else m.innerHTML=sectionHTML(p,tab);
  refreshAll();
}
function renderTabs(p){
  const t=[['project','Proyecto',''],['typical','Unidad típica',p.typical.length],['common','Áreas comunes',p.common.length],['summary','Resumen','']];
  $('#tabs').innerHTML=t.map(([k,l,c])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}${c!==''?`<span class="count">${c}</span>`:''}</button>`).join('');
}
function renderHome(){
  const list=Object.entries(projects).filter(([,p])=>p&&!p._deleted).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  $('#main').innerHTML=`
  <div class="sec-head"><div><h2>Proyectos</h2><p>Cada proyecto es un takeoff: unidad típica, áreas comunes y materiales.</p></div><div class="spacer"></div>
  <button class="btn primary" data-act="newp">+ Nuevo proyecto</button></div>
  ${list.length?`<div class="plist">${list.map(([id,p])=>{const c=projCalc(normalize(p));return`
    <div class="pcard">
      <h3>${esc(p.name||'Sin nombre')}</h3>
      <div class="meta">${esc([p.address,p.levels].filter(Boolean).join(' · ')||'Sin dirección')}</div>
      <div class="meta">${val(p.units)} unidades · ${p.typical.length} cuartos típicos · ${p.common.length} áreas comunes</div>
      <div><span class="big">${fmt0(c.grand.tot)}</span> <span class="meta">hojas</span></div>

    const r=findRoom(el.dataset.id);if(!r)return;
    const c=roomCalc(r,A);
    const set=(k,v)=>{const o=el.querySelector(`[data-o="${k}"]`);if(o)o.textContent=v;};

    set('w',fmt(c.w));set('c',fmt(c.c));set('m',fmt(c.m));
    const ex=(f,sf,sh)=>{const raw=r[f];return(r.mode!=='dim'&&isExpr(raw)?`= ${fmt(sf)} ft² · `:'')+(sf?`${sh} hojas`:'');};
    set('wsx',r.mode==='dim'?(c.w?c.ws+' hojas':''):ex('walls',c.w,c.ws));
    set('csx',r.mode==='dim'?(c.c?c.cs+' hojas':''):ex('clg',c.c,c.cs));
    set('msx',r.mode==='dim'?(c.m?c.ms+' hojas':''):ex('mr',c.m,c.ms));
  });
  const t=projCalc(p);
  $('#k-tot').textContent=fmt0(t.grand.tot);$('#k-w').textContent=fmt0(t.sheets.w);$('#k-c').textContent=fmt0(t.sheets.c);$('#k-m').textContent=fmt0(t.sheets.m);

    sT.innerHTML=`<thead><tr><th>Área</th><th># Unidades</th><th>ft² Walls</th><th>ft² Ceiling</th><th>ft² MR</th><th>Total hojas</th></tr></thead><tbody>
      <tr><td>Typical Units</td><td class="num">${fmt(t.u)}</td><td class="num">${fmt(t.typ.w)}</td><td class="num">${fmt(t.typ.c)}</td><td class="num">${fmt(t.typ.m)}</td><td class="num">${fmt0(t.typ.tot)}</td></tr>
      <tr><td>Common Areas</td><td>N/A</td><td class="num">${fmt(t.cs.w)}</td><td class="num">${fmt(t.cs.c)}</td><td class="num">${fmt(t.cs.m)}</td><td class="num">${fmt0(t.cs.tot)}</td></tr>
      <tr class="grand"><td>GRAND TOTAL</td><td class="num">${fmt(t.u)}</td><td class="num">${fmt(t.grand.w)}</td><td class="num">${fmt(t.grand.c)}</td><td class="num">${fmt(t.grand.m)}</td><td class="num">${fmt0(t.grand.tot)}</td></tr></tbody>`;
  }
  const mT=$('#matT');
  if(mT){
    const active=document.activeElement&&document.activeElement.id;
    if(!mT.dataset.built){
      mT.innerHTML=`<thead><tr><th>Material</th><th>Base ft²</th><th>Tasa</th><th>Unidad tasa</th><th>Cant. (+desp.)</th><th>Empaque</th><th>Unidad empaque</th><th>A pedir</th></tr></thead><tbody>${p.mats.map((m,i)=>`
        <tr><td>${esc(m.name)}</td><td class="num" data-mo="${i}-b"></td><td><input class="num" id="m-${i}-rate" data-m="${i}.rate" inputmode="decimal" value="${esc(m.rate)}"></td><td>${esc(m.rateUnit)}</td>
        <td class="num" data-mo="${i}-q"></td><td><input class="num" id="m-${i}-pack" data-m="${i}.pack" inputmode="decimal" value="${esc(m.pack)}"></td><td>${esc(m.packUnit)}</td><td class="num"><b data-mo="${i}-p"></b></td></tr>`).join('')}</tbody>`;
      mT.dataset.built='1';
    }
    t.mats.forEach((m,i)=>{
      mT.querySelector(`[data-mo="${i}-b"]`).textContent=fmt(m.basisVal);

function findRoom(id){const p=projects[currentId];return p.typical.find(r=>r.id===id)||p.common.find(r=>r.id===id);}
function secOf(id){const p=projects[currentId];return p.typical.some(r=>r.id===id)?'typical':'common';}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const el=e.target,p=projects[currentId];if(!p)return;
  if(el.dataset.p){p[el.dataset.p]=el.value;if(el.dataset.p==='units'){const o=document.querySelectorAll('[data-p="units"]');o.forEach(x=>{if(x!==el)x.value=el.value;});}}
  else if(el.dataset.a){p.assume[el.dataset.a]=el.dataset.a==='waste'?(val(el.value)/100):val(el.value);}
  else if(el.dataset.m){const[i,k]=el.dataset.m.split('.');p.mats[+i][k]=val(el.value);}
  else if(el.dataset.f){const room=el.closest('.room');const r=findRoom(room.dataset.id);r[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;}
  else return;
  refreshAll();touch();
});
document.addEventListener('change',e=>{if(e.target.type==='checkbox')return;});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  e.preventDefault();
  const ins=[...document.querySelectorAll('#main input:not([type=checkbox])')];
  const i=ins.indexOf(e.target);
  if(i>=0&&i<ins.length-1){ins[i+1].focus();ins[i+1].select&&ins[i+1].select();}
  else e.target.blur();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return;}
  if(b.id==='backBtn'){currentId=null;render();return;}
  if(b.id==='exportBtn'||b.dataset.act==='export'){exportXlsx();return;}
  if(b.dataset.act==='newp'){const id=uid();projects[id]=newProject();currentId=id;tab='project';touch();render();setTimeout(()=>{const n=$('#p-name');n&&(n.focus(),n.select());},50);return;}
  if(b.dataset.open){currentId=b.dataset.open;normalize(projects[currentId]);tab='typical';render();window.scrollTo(0,0);return;}
  if(b.dataset.dupp){const id=uid();const c=clean(projects[b.dataset.dupp]);c.name=(c.name||'')+' (copia)';c.updatedAt=Date.now();[...c.typical,...c.common].forEach(r=>r.id=uid());projects[id]=c;currentId=id;touch();currentId=null;render();toast('Proyecto duplicado');return;}
  if(b.dataset.delp){
    if(b.dataset.armed){await removeProject(b.dataset.delp);render();toast('Proyecto borrado');}
    else{b.dataset.armed='1';b.textContent='¿Seguro? Toca otra vez';b.classList.add('primary');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Borrar';b.classList.remove('primary');}},3000);}
    return;
  }
  const p=projects[currentId];if(!p)return;
  if(b.dataset.chip||b.dataset.act==='add'){
    const r=newRoom(b.dataset.chip||'');p[tab].push(r);touch();renderTabs(p);
    const wrap=$('#rooms');
    if(wrap.querySelector('.empty'))wrap.innerHTML='';
    wrap.insertAdjacentHTML('beforeend',roomHTML(r));refreshAll();
    const el=document.getElementById(b.dataset.chip?`r-${r.id}-qty`:`r-${r.id}-name`);
    el.scrollIntoView({block:'center',behavior:'smooth'});el.focus();el.select&&el.select();
    return;
  }
  const room=b.closest('.room');if(!room)return;
  const id=room.dataset.id,sec=secOf(id),list=p[sec],idx=list.findIndex(r=>r.id===id);
  if(b.dataset.mode){list[idx].mode=b.dataset.mode;touch();room.outerHTML=roomHTML(list[idx]);refreshAll();return;}
  if(b.dataset.act==='dup'){const c={...clean(list[idx]),id:uid()};list.splice(idx+1,0,c);touch();renderTabs(p);room.insertAdjacentHTML('afterend',roomHTML(c));refreshAll();toast('Cuarto duplicado');return;}
  if(b.dataset.act==='del'){
    if(b.dataset.armed){list.splice(idx,1);touch();renderTabs(p);room.remove();if(!list.length)$('#rooms').innerHTML='<div class="empty">Sin cuartos todavía. Toca un nombre arriba o “Agregar cuarto”.</div>';refreshAll();}
    else{b.dataset.armed='1';b.textContent='Borrar';b.classList.add('confirm');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='✕';b.classList.remove('confirm');}},3000);}
  }
});
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}

/* ---------- Excel export (same layout as the Template sheet, live formulas) ---------- */
async function exportXlsx(){
  const p=projects[currentId];if(!p)return;
  if(!window.ExcelJS){toast('No cargó el generador de Excel. Recarga la aplicación.');return;}
  const A=p.assume,t=projCalc(p);
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Takeoff',{views:[{showGridLines:false}]});
  ws.columns=[{width:3},{width:34},{width:12},{width:13},{width:13},{width:13},{width:13},{width:13},{width:26},{width:14},{width:14},{width:22}];
  const thin={style:'thin',color:{argb:'FFBFC6CE'}};const box={top:thin,left:thin,bottom:thin,right:thin};
  const hdrFill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F2A36'}};
  const subFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7EBF0'}};
  const inFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF8DC'}};
  const C=(addr,v)=>{const c=ws.getCell(addr);c.value=v;return c;};
  const F=(addr,f,r)=>{const c=ws.getCell(addr);c.value={formula:f,result:r};return c;};
  const header=(row,labels)=>{labels.forEach((l,i)=>{const c=ws.getCell(row,2+i);c.value=l;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill=hdrFill;c.border=box;c.alignment={wrapText:true,vertical:'middle',horizontal:i?'center':'left'};});ws.getRow(row).height=30;};
  const title=(row,txt)=>{const c=C('B'+row,txt);c.font={bold:true,size:13};};

  F('B2','IF(C4="","Project Takeoff","Takeoff – "&C4)','Takeoff – '+p.name).font={bold:true,size:16};
  [['Project',p.name],['Address',p.address],['Levels / Scope',p.levels],['Drawings / Scale',p.drawings],['Date',p.date]].forEach(([l,v],i)=>{C('B'+(4+i),l).font={bold:true};const c=C('C'+(4+i),v||null);c.border={bottom:thin};});
  C('I4','Assumptions').font={bold:true};C('K4','Value').font={bold:true};
  [['Sheet Size – Walls (ft²)',+A.wall],['Sheet Size – Ceiling (ft²)',+A.clg],['Sheet Size – MR (ft²)',+A.mr],['Waste Factor',+A.waste],['Ceiling Height (ft)',+A.h]].forEach(([l,v],i)=>{C('I'+(5+i),l);const c=C('K'+(5+i),v);c.fill=inFill;c.border=box;if(i===3)c.numFmt='0%';});
  C('I10','Sheets = ROUNDUP(ft² ÷ Sheet Size × (1 + Waste))').font={italic:true,color:{argb:'FF5A6775'}};

  // layout rows
  const tList=p.typical.length?p.typical:[newRoom('')],cList=p.common.length?p.common:[newRoom('')];
  const tStart=19,tEnd=tStart+tList.length-1,tSub=tEnd+1;
  const cTitle=tSub+2,cHdr=cTitle+1,cStart=cHdr+1,cEnd=cStart+cList.length-1,cSub=cEnd+1;
  const mTitle=cSub+2,mHdr=mTitle+1,mStart=mHdr+1;

  title(11,'Project Summary');
  header(12,['Area','# of Units','ft² Walls','ft² Ceiling','ft² MR','Total Sheets','Sheet Size']);
  const sz=`"Walls "&$K$5&" / Clg "&$K$6&" / MR "&$K$7&" ft²"`,szR=`Walls ${A.wall} / Clg ${A.clg} / MR ${A.mr} ft²`;
  C('B13','Typical Units');C('C13',t.u).fill=inFill;
  F('D13',`$C13*D${tSub}`,t.typ.w);F('E13',`$C13*F${tSub}`,t.typ.c);F('F13',`$C13*H${tSub}`,t.typ.m);F('G13',`$C13*K${tSub}`,t.typ.tot);F('H13',sz,szR);
  C('B14','Common Areas');C('C14','N/A');F('D14',`D${cSub}`,t.cs.w);F('E14',`F${cSub}`,t.cs.c);F('F14',`H${cSub}`,t.cs.m);F('G14',`K${cSub}`,t.cs.tot);F('H14','H13',szR);
  C('B15','GRAND TOTAL');F('C15','C13',t.u);F('D15','SUM(D13:D14)',t.grand.w);F('E15','SUM(E13:E14)',t.grand.c);F('F15','SUM(F13:F14)',t.grand.m);F('G15','SUM(G13:G14)',t.grand.tot);
  for(let r=13;r<=15;r++)for(let c=2;c<=8;c++){const cell=ws.getCell(r,c);cell.border=box;if(c>=4&&c<=6)cell.numFmt='#,##0.0';if(c===7)cell.numFmt='#,##0';}
  for(let c=2;c<=8;c++){ws.getCell(15,c).font={bold:true};ws.getCell(15,c).fill=subFill;}

  const roomHdr=['Room','Qty','ft² Walls','Walls (sheets)','ft² Ceiling','Ceiling (sheets)','ft² MR','MR (sheets)','Sheets / Room','Total Sheets','Measurements'];
  function writeRooms(list,start,end,sub){
    list.forEach((r,i)=>{
      const row=start+i,c=roomCalc(r,A);
      C('B'+row,r.name||null);C('C'+row,c.q);
      C('D'+row,c.w||null);F('E'+row,`ROUNDUP(D${row}/$K$5*(1+$K$8),0)`,c.ws);
      C('F'+row,c.c||null);F('G'+row,`ROUNDUP(F${row}/$K$6*(1+$K$8),0)`,c.cs);
      C('H'+row,c.m||null);F('I'+row,`ROUNDUP(H${row}/$K$7*(1+$K$8),0)`,c.ms);
      F('J'+row,`E${row}+G${row}+I${row}`,c.per);F('K'+row,`C${row}*J${row}`,c.tot);
      if(r.mode==='dim')C('L'+row,`${lenTxt(c.L)} × ${lenTxt(c.W)} × h ${lenTxt(c.H)}${r.mrWalls?' (MR walls)':''}`);
      else{const parts=[['W',r.walls],['C',r.clg],['MR',r.mr]].filter(([,v])=>isExpr(v)).map(([k,v])=>`${k}: ${v}`);if(parts.length)C('L'+row,parts.join('  '));}
      for(let cc=2;cc<=12;cc++){const cell=ws.getCell(row,cc);cell.border=box;if([3,4,6,8].includes(cc))cell.fill=inFill;if([4,6,8].includes(cc))cell.numFmt='#,##0.0';}
      ws.getCell('L'+row).font={color:{argb:'FF5A6775'},size:9};
    });
    const s=secCalc(list,A);
    C('B'+sub,'SUB-TOTAL');F('C'+sub,`SUM(C${start}:C${end})`,s.q);
    [['D',s.w],['E',s.ws],['F',s.c],['G',s.cs],['H',s.m],['I',s.ms],['J',s.per]].forEach(([L,v])=>F(L+sub,`SUMPRODUCT($C${start}:$C${end},${L}${start}:${L}${end})`,v));
    F('K'+sub,`SUM(K${start}:K${end})`,s.tot);
    for(let cc=2;cc<=11;cc++){const cell=ws.getCell(sub,cc);cell.font={bold:true};cell.fill=subFill;cell.border=box;if([4,6,8].includes(cc))cell.numFmt='#,##0.0';}
  }
  title(17,'Typical Unit — measurements per ONE unit (enter Qty of each room inside the unit)');
  header(18,roomHdr);writeRooms(tList,tStart,tEnd,tSub);
  title(cTitle,'Common Areas');header(cHdr,roomHdr);writeRooms(cList,cStart,cEnd,cSub);

  title(mTitle,'Materials');
  header(mHdr,['Material','Basis ft²','Usage Rate','Rate Unit','Qty (+ waste)','Qty Unit','Pack Size','Pack Unit','Packs to Order']);
  t.mats.forEach((m,i)=>{
    const row=mStart+i;
    const bf=m.basis==='clg'?'E15':m.basis==='wallsmr'?'D15+F15':'SUM(D15:F15)';
    C('B'+row,m.name);F('C'+row,bf,m.basisVal);C('D'+row,+m.rate).fill=inFill;C('E'+row,m.rateUnit);
    F('F'+row,`ROUNDUP(C${row}*D${row}*(1+$K$8),0)`,m.qty);C('G'+row,m.qtyUnit);C('H'+row,+m.pack).fill=inFill;C('I'+row,m.packUnit);
    F('J'+row,`ROUNDUP(F${row}/H${row},0)`,m.packs).font={bold:true};
    for(let cc=2;cc<=10;cc++)ws.getCell(row,cc).border=box;
    ws.getCell('C'+row).numFmt='#,##0.0';ws.getCell('F'+row).numFmt='#,##0';
  });
  ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};

  try{
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const fname=`Takeoff - ${(p.name||'Proyecto').replace(/[\\/:*?"<>|]/g,'-')}.xlsx`;
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download=fname;
    document.body.appendChild(link);link.click();link.remove();
    // Safari may still be consuming the URL after the click.
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast('Excel generado. Revisa Descargas en Safari.');
  }catch(err){console.error('Excel export failed',err);toast('No se pudo generar el Excel. Intenta de nuevo.');}

}

render();initStore();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js').catch(err=>{console.error(err);toast('No se activó el modo sin conexión. Recarga con conexión.');});
}
})();
</script>
